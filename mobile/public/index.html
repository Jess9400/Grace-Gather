    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* The app's ivory from the first moment, never a white flash. */
        background: #fffcf3;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown while the app starts; the app replaces it when it draws. */
      .gg-loading {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #302c28;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        padding: 24px;
      }
      .gg-loading .gg-name {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.32em;
      }
      .gg-loading .gg-line {
        font-size: 24px;
        line-height: 1.3;
      }
      .gg-loading .gg-rule {
        width: 44px;
        height: 2px;
        background: #b28a3e;
        animation: gg-breathe 2.4s ease-in-out infinite;
      }
      @keyframes gg-breathe {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .gg-loading .gg-rule {
          animation: none;
        }
      }
    </style>
  </head>
