      }
      .gg-loading .gg-rule {
        width: 44px;
        height: 2px;
        background: #c9a45c;
        animation: gg-breathe 2.4s ease-in-out infinite;
      }
      @keyframes gg-breathe {

          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .gg-loading .gg-rule {
          animation: none;
        }
      }
