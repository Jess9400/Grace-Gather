<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Grace & Gather • Pro study</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #120e0b;
      color: #f4ebda;
      font: 15px/1.55 system-ui;
    }
    button,
    select {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    button:focus-visible,
    select:focus-visible {
      outline: 2px solid #d9b974;
      outline-offset: 4px;
    }
    main {
      max-width: 460px;
      margin: auto;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 90% -5%, #60412480, transparent 45%), #1b1612;
      padding: 28px 24px 52px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h1,
    h2 {
      font-family: Georgia, serif;
      line-height: 1.16;
      font-weight: 400;
    }
    h1 {
      font-size: 39px;
      margin: 12px 0;
    }
    h2 {
      font-size: 29px;
      margin: 12px 0;
    }
    h3 {
      font-size: 17px;
      line-height: 1.3;
      margin: 0;
    }
    p {
      color: #b7a993;
      margin: 10px 0 16px;
    }
    small {
      color: #b7a993;
      font-size: 12px;
    }
    .gold {
      color: #d9b974;
    }
    .eyebrow {
      letter-spacing: 2px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #d9b97450;
      box-shadow: 0 0 20px #d9b97424;
      color: #d9b974;
      font-size: 12px;
      letter-spacing: 2px;
    }
    select {
      border: 0;
      background: #2a221b;
      border-radius: 10px;
      padding: 8px;
      max-width: 100%;
    }
    .selectors {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 20px 0;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #f4ebda25;
      margin: 26px 0;
    }
    .tabs button {
      border: 0;
      border-bottom: 2px solid transparent;
      background: none;
      flex: 1;
      padding: 13px 2px;
      font-size: 13px;
      color: #b7a993;
    }
    .tabs .active {
      border-color: #d9b974;
      color: #f4ebda;
    }
    button.card {
      width: 100%;
      text-align: left;
      border: 1px solid #d9b97445;
      background:
        radial-gradient(circle at top right, #bb864b36, transparent 65%),
        #2a221b;
      border-radius: 22px;
      padding: 22px;
    }
    .dailyIcon {
      float: right;
      color: #d9b974;
      margin-left: 12px;
    }
    .dailyIcon svg {
      width: 54px;
      height: 54px;
    }
    .link {
      color: #d9b974;
      font-size: 13px;
    }
    .section {
      margin: 30px 0 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }
    .plan {
      text-align: left;
      border: 0;
      padding: 0;
      overflow: hidden;
      border-radius: 16px;
      background: #2a221b;
    }
    .art {
      height: 106px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at center, #b48b5145, transparent 75%), #332a21;
      color: #d9b974;
    }
    .art svg {
      width: 50px;
      height: 50px;
      filter: drop-shadow(0 10px 8px #0005);
    }
    .plan:nth-child(3n + 2) .art {
      background:
        radial-gradient(ellipse at center, #71817244, transparent 75%), #252b26;
    }
    .plan:nth-child(3n) .art {
      background:
        radial-gradient(ellipse at center, #c9a45c33, transparent 75%), #3b2b20;
    }
    .planBody {
      padding: 15px;
    }
    .plan h3 {
      min-height: 44px;
      font-family: Georgia;
      font-weight: 400;
      font-size: 19px;
    }
    .plan small {
      display: block;
      margin-top: 8px;
    }
    .tool {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 22px 0;
      background: none;
      border: 0;
      border-bottom: 1px solid #f4ebda20;
    }
    .tool svg {
      width: 26px;
      height: 26px;
      color: #d9b974;
    }
    .tool span {
      flex: 1;
    }
    .quiet {
      border: 0;
      background: none;
      color: #d9b974;
      padding: 16px 0;
    }
    .footer {
      font-size: 11px;
      margin-top: 26px;
    }
    .progress {
      height: 3px;
      background: #f4ebda20;
      margin-top: 16px;
      border-radius: 3px;
    }
    .progress span {
      display: block;
      height: 100%;
      background: #d9b974;
    }
    .activePlan {
      padding: 18px 0;
      border-bottom: 1px solid #f4ebda20;
    }
    .primary {
      border: 0;
      background: #f1e4cb;
      color: #1b1612;
      border-radius: 28px;
      padding: 14px 20px;
      width: 100%;
      font-weight: 600;
      margin-top: 16px;
    }
    .secondary {
      background: none;
      border: 1px solid #f4ebda30;
      color: #f4ebda;
    }
    dialog {
      max-width: 400px;
      width: calc(100% - 32px);
      max-height: 85vh;
      overflow: auto;
      background: #2a221b;
      color: #f4ebda;
      border: 1px solid #d9b97455;
      border-radius: 24px;
      padding: 26px;
    }
    dialog::backdrop {
      background: #000b;
    }
    .word {
      font: 32px Georgia;
      color: #f4ebda;
    }
    .wordChoices {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .wordChoices button {
      border: 1px solid #d9b97450;
      background: none;
      border-radius: 15px;
      padding: 8px 12px;
    }
    hr {
      border: 0;
      border-top: 1px solid #f4ebda25;
      margin: 22px 0;
    }
    @media (min-width: 600px) {
      main {
        margin-top: 30px;
        margin-bottom: 30px;
        border: 1px solid #f4ebda18;
        border-radius: 30px;
      }
    }

    main {
      background:
        radial-gradient(ellipse at top, #60412438, transparent 420px), #1b1612;
    }
    h1 {
      font-size: 35px;
      line-height: 1.2;
    }
    .appBrand {
      display: flex;
      gap: 12px;
      align-items: center;
      letter-spacing: 3px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .appBrand img {
      width: 34px;
      height: 34px;
    }
    button.card {
      background: #2a221b;
      border: 1px solid #f4ebda2d;
      border-radius: 19px;
    }
    .art,
    .plan:nth-child(3n + 2) .art,
    .plan:nth-child(3n) .art {
      background: #2f271f;
      height: 75px;
    }
    .art svg {
      width: 38px;
      height: 38px;
      filter: none;
    }
    .plan {
      border-radius: 19px;
    }
    .plan h3 {
      font-family: system-ui;
      font-size: 18px;
      font-weight: 600;
    }
    .planBody {
      padding: 16px;
    }
    h2 {
      font-size: 28px;
    }
    .badge {
      box-shadow: none;
    }
    .selectors {
      margin: 14px 0;
    }
  </style>

          '" onclick="annual=true;prices()">' +
          t.annual +
          "</button><p>" +
          t.trial +
          "</p><small>" +
          t.preview +
          " · " +
          t.notice +
          "</small>",
      );
    }
    render();
  </script>
</html>
